<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>imagegen — local</title>
<style>
  :root {
    --bg: #0b0b0f; --panel: #15151c; --panel2: #1d1d27; --line: #2a2a37;
    --text: #ececf1; --muted: #9a9aad; --accent: #7c5cff; --accent2: #d94fd5;
    --danger: #ff6b6b; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 70% -10%, #201a3a 0%, var(--bg) 55%);
    color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 18px 24px;
    border-bottom: 1px solid var(--line);
  }
  .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .tag { color: var(--muted); font-size: 12.5px; }
  #status { margin-left: auto; font-size: 12.5px; color: var(--muted); }
  #status b { color: var(--text); font-weight: 600; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 26px 24px 80px; }
  .composer {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  textarea#prompt {
    width: 100%; min-height: 74px; resize: vertical; background: transparent; border: none;
    color: var(--text); font: inherit; font-size: 16px; outline: none;
  }
  textarea#prompt::placeholder { color: #666677; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 6px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .field input, .field select {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 7px 9px; font: inherit; font-size: 13px; min-width: 84px;
  }
  #negative { flex: 1 1 200px; min-width: 160px; }
  .spacer { flex: 1; }
  button.go {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white;
    border: none; border-radius: 11px; padding: 11px 22px; font-size: 15px; font-weight: 640;
    cursor: pointer; transition: transform .06s ease, opacity .2s;
  }
  button.go:hover { transform: translateY(-1px); }
  button.go:disabled { opacity: .55; cursor: default; transform: none; }
  .meta { margin-top: 12px; color: var(--muted); font-size: 12.5px; min-height: 18px; }
  .meta.err { color: var(--danger); }
  .grid { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; position: relative;
  }
  .card img { display: block; width: 100%; height: auto; }
  .card .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 11px; font-size: 12px; color: var(--muted);
  }
  .card a.dl { color: var(--accent); text-decoration: none; font-weight: 600; }
  .skeleton {
    aspect-ratio: 1/1; background: linear-gradient(100deg, #191922 30%, #23232f 50%, #191922 70%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 14px; }
  .empty code { background: var(--panel2); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div>
    <h1>imagegen</h1>
    <div class="tag">local &amp; private — runs on your hardware, no external filter</div>
  </div>
  <div id="status">checking…</div>
</header>

<div class="wrap">
  <div class="composer">
    <textarea id="prompt" placeholder="Describe an image…  e.g. a lone lighthouse in a storm, cinematic, volumetric light"></textarea>
    <input id="negative" class="hidden-until" placeholder="Negative prompt (optional) — what to avoid" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;margin:8px 0 12px;" />
    <div class="controls">
      <div class="field"><label>Size</label>
        <select id="size">
          <option value="1024x1024">1024 × 1024</option>
          <option value="1152x896">1152 × 896</option>
          <option value="896x1152">896 × 1152</option>
          <option value="1216x832">1216 × 832 (wide)</option>
          <option value="832x1216">832 × 1216 (tall)</option>
        </select>
      </div>
      <div class="field"><label>Images</label><input id="num" type="number" min="1" max="8" value="1" /></div>
      <div class="field"><label>Steps</label><input id="steps" type="number" min="1" max="100" value="30" /></div>
      <div class="field"><label>Guidance</label><input id="guidance" type="number" min="0" max="20" step="0.5" value="6.5" /></div>
      <div class="field"><label>Seed</label><input id="seed" type="number" placeholder="random" /></div>
      <div class="spacer"></div>
      <button class="go" id="go">Generate</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="grid" id="grid">
    <div class="empty" id="empty">Your generations will appear here. Type a prompt and hit <code>Generate</code>.</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function loadStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    if (!s.deps_installed) {
      $('status').innerHTML = '<b style="color:var(--danger)">deps missing</b> — pip install -r imagegen/requirements.txt';
      return;
    }
    $('status').innerHTML = `<b>${s.device}</b> · ${s.model.split('/').pop()}`;
  } catch (e) {
    $('status').textContent = 'server unreachable';
  }
}

function skeletons(n) {
  $('empty')?.remove();
  const grid = $('grid');
  const nodes = [];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = '<div class="skeleton"></div>';
    grid.prepend(c);
    nodes.push(c);
  }
  return nodes;
}

async function generate() {
  const prompt = $('prompt').value.trim();
  if (!prompt) { $('prompt').focus(); return; }
  const [w, h] = $('size').value.split('x').map(Number);
  const num = Math.max(1, Math.min(8, parseInt($('num').value) || 1));
  const seedVal = $('seed').value.trim();

  const body = {
    prompt,
    negative_prompt: $('negative').value.trim(),
    width: w, height: h, num_images: num,
    steps: parseInt($('steps').value) || 30,
    guidance: parseFloat($('guidance').value) || 6.5,
    seed: seedVal === '' ? null : parseInt(seedVal),
  };

  $('go').disabled = true;
  $('meta').className = 'meta';
  $('meta').textContent = `rendering ${num} image(s)…  (first run also loads the model — can take a minute)`;
  const holders = skeletons(num);

  try {
    const res = await fetch('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));

    holders.forEach((h) => h.remove());
    const grid = $('grid');
    data.images.slice().reverse().forEach((im) => {
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML =
        `<img src="${im.data_url}" alt="generated image" />` +
        `<div class="bar"><span>seed ${im.seed}</span>` +
        `<a class="dl" href="${im.data_url}" download="${im.file}">download</a></div>`;
      grid.prepend(c);
    });
    $('meta').textContent = `done in ${data.elapsed_s}s on ${data.device} · ${data.model.split('/').pop()}`;
  } catch (e) {
    holders.forEach((h) => h.remove());
    $('meta').className = 'meta err';
    $('meta').textContent = 'error: ' + e.message;
  } finally {
    $('go').disabled = false;
  }
}

$('go').addEventListener('click', generate);
$('prompt').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') generate();
});
loadStatus();
</script>
</body>
</html>
